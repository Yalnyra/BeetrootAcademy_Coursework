; ---------------------------------------------------------------------------
; ESP32-S3-WROOM-1 N16R8  (16 MB QIO flash + 8 MB OPI PSRAM)
; Docs: https://docs.platformio.org/page/projectconf.html
; ---------------------------------------------------------------------------

[platformio]
description = <one-line description of this assignment>
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 memory layout ----------------------------------------------------
board_upload.flash_size        = 16MB
board_build.flash_mode         = qio
board_build.arduino.memory_type = qio_opi   ; octal PSRAM
board_build.partitions         = default_16MB.csv

; --- Build ------------------------------------------------------------------
build_flags =
    -Wall
    -Wextra
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; hardware CDC - keeps the USB-Serial-JTAG
                                  ; controller on the internal USB PHY.
                                  ; =0 (TinyUSB) hands the PHY to USB-OTG and
                                  ; JTAG disappears from the native port.
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial goes over the native USB port

; --- Upload / monitor -------------------------------------------------------
; This PC enumerates a dozen COM ports, so auto-detection is a coin flip -
; both ports are pinned explicitly. Adjust if Windows renumbers them.
;   COM14 = CH343 USB-to-UART port  (esptool flashing - always works)
;   COM10 = native USB port         (HWCDC serial + JTAG)
upload_port   = COM14
upload_speed  = 921600
monitor_port  = COM16
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Flash over JTAG instead of UART. Leave DISABLED until `PIO Debug` is proven
; working: it routes uploads through OpenOCD, so a failed attach also blocks
; flashing and you lose the one path that always works.
; upload_protocol = esp-builtin

; --- Debug ------------------------------------------------------------------
; esp-builtin = the S3's on-chip USB-Serial-JTAG bridge; no external probe.
; Requires the NATIVE USB port AND firmware that leaves the USB PHY on the
; USB-Serial-JTAG controller (see ARDUINO_USB_MODE above).
debug_tool = esp-builtin
debug_init_break = tbreak setup
build_type = debug

; The platform pins OpenOCD v0.11.0-esp32-20220706 (a 2022 build, old libusb).
; If OpenOCD fails with LIBUSB_ERROR_NOT_FOUND while Device Manager shows
; "USB JTAG/serial debug unit" bound to WinUSB, uncomment to pull a current
; build (v0.12.0-esp32) - run `pio pkg update` afterwards.
; platform_packages =
;     platformio/tool-openocd-esp32@^2.1200.0

; --- Libraries --------------------------------------------------------------
; lib_deps =

; ---------------------------------------------------------------------------
; ESP-IDF variant - uncomment and set as default_envs when the assignment
; asks for the IDF API instead of Arduino.
; ---------------------------------------------------------------------------
; [env:esp32s3_n16r8_idf]
; platform  = espressif32
; board     = esp32-s3-devkitc-1
; framework = espidf
; board_upload.flash_size = 16MB
; monitor_speed = 115200
