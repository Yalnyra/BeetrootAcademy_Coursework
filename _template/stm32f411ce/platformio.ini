; ---------------------------------------------------------------------------
; STM32F411CEU6 "Black Pill" - bare-metal / STM32Cube HAL project
; Docs: https://docs.platformio.org/page/projectconf.html
; ---------------------------------------------------------------------------

[platformio]
description = <one-line description of this assignment>
default_envs = blackpill_f411ce

[env:blackpill_f411ce]
platform  = ststm32
board     = blackpill_f411ce
framework = stm32cube

; --- Upload -----------------------------------------------------------------
; ST-Link V2 (default). For the on-board USB bootloader instead, comment the
; two lines below and uncomment the dfu block.
upload_protocol = stlink
debug_tool      = stlink
; upload_protocol = dfu

; --- Build ------------------------------------------------------------------
build_flags =
    -Wall
    -Wextra
    -Og
    -g3

; --- Serial monitor ---------------------------------------------------------
monitor_speed = 115200

; --- Libraries --------------------------------------------------------------
; lib_deps =
